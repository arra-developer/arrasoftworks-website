  <style>
    @font-face { font-family: "Aonic"; src: url("/aonic.medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }
    /* Metric-matched fallbacks so the web-font swap doesn't reflow text (see styles.css) */
    @font-face { font-family: "Satoshi Fallback"; src: local("Arial"), local("ArialMT"); font-weight: 300 500; size-adjust: 102.44%; ascent-override: 98.59%; descent-override: 23.43%; line-gap-override: 9.76%; }
    @font-face { font-family: "Satoshi Fallback"; src: local("Arial Bold"), local("Arial-BoldMT"); font-weight: 600 700; size-adjust: 98.21%; ascent-override: 102.85%; descent-override: 24.44%; line-gap-override: 10.18%; }
    @font-face { font-family: "Satoshi Fallback"; src: local("Arial Bold"), local("Arial-BoldMT"); font-weight: 800 900; size-adjust: 101.48%; ascent-override: 99.52%; descent-override: 23.65%; line-gap-override: 9.85%; }
    :root {
      --ink: #131311; --ink-900: #1c1d1a; --ink-800: #2a2a27; --ink-700: #41413f; --ink-600: #6c6c6a; --ink-400: #b9b9b7; --ink-100: #f4f4f4;
      --paper: #fafafa; --cream: #f3f2ea; --accent: #c6fd50; --accent-dark: #96d411; --accent-glow: rgba(198, 253, 80, .4);

      --shadow: 0 1px 2px rgba(19, 19, 17, .05), 0 16px 36px -16px rgba(19, 19, 17, .28);
      --hairline: rgba(19, 19, 17, .1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Satoshi", "Satoshi Fallback", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--paper);

    }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--accent); color: var(--ink); }

    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 12px; background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 500; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px 1px var(--accent); }
    .code { font-size: clamp(110px, 24vw, 220px); font-weight: 900; line-height: .9; letter-spacing: -.04em; }
    .code mark { display: inline-block; background: var(--accent); color: var(--ink); padding: 0 .08em .04em; border-radius: 12px; rotate: -3deg; }
    h1 { font-size: clamp(30px, 5vw, 48px); font-weight: 900; line-height: 1.1; max-width: 18ch; }
    .sub { font-size: 18px; font-weight: 500; color: var(--ink-700); max-width: 440px; }
    .check { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 8px; background: var(--ink); color: var(--ink-400); font-size: 14px; font-weight: 500; text-align: left; }
    .check i { position: relative; width: 14px; height: 14px; border: 1px solid var(--ink-400); border-radius: 3px; flex-shrink: 0; }
    .check s { text-decoration-color: var(--accent); text-decoration-thickness: 2px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px; }
    .btn { display: inline-flex; align-items: center; gap: 16px; min-height: 48px; padding: 8px 8px 8px 24px; border: 1px solid var(--hairline); border-radius: 10px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
    .btn--accent { background: var(--accent); box-shadow: 0 8px 24px -10px var(--accent-glow); }
    .btn--ghost { padding-right: 24px; }
    .btn__arrow { width: 32px; height: 32px; border-radius: 5px; display: grid; place-items: center; background: var(--ink); color: var(--paper); font-size: 16px; }
    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 24px; font-size: 14px; font-weight: 700; }
    .links a { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
    footer { text-align: center; padding: 24px; font-size: 14px; color: var(--ink-600); }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
    @media (prefers-reduced-motion: no-preference) {
      @view-transition { navigation: auto; }
      ::view-transition-old(root) { animation: vtOut .28s cubic-bezier(.44, 0, .56, 1) both; }
      ::view-transition-new(root) { animation: vtIn .5s var(--ease-out) both; }
      @keyframes vtOut { to { opacity: 0; transform: translateY(-12px); } }
      @keyframes vtIn { from { opacity: 0; transform: translateY(16px); } }
      /* Entrance: transform/opacity only */
      main > * { animation: rise .8s var(--ease-out) both; }
      main > :nth-child(3) { animation-delay: .08s; } main > :nth-child(4) { animation-delay: .16s; }
      main > :nth-child(5) { animation-delay: .24s; } main > :nth-child(6) { animation-delay: .32s; } main > :nth-child(7) { animation-delay: .4s; }
      main > .glow { animation: glow 14s ease-in-out infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
      @keyframes glow { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(-47%, -53%) scale(1.06); } }
      .code mark { animation: wobble 4s ease-in-out 1s infinite; }
      @keyframes wobble { 0%, 100% { rotate: -3deg; } 50% { rotate: 3deg; } }
      .dot { animation: pulse 2s ease-out infinite; }
      @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--accent-glow); } 100% { box-shadow: 0 0 0 8px rgba(198, 253, 80, 0); } }
      .check i::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid var(--accent); border-width: 0 2px 2px 0; rotate: 45deg; scale: 0; animation: tick .5s var(--ease-spring) 1.1s forwards; }
      .check s { text-decoration-color: transparent; animation: strike .5s var(--ease-soft) 1.3s forwards; }
      @keyframes tick { to { scale: 1; } }
      @keyframes strike { to { text-decoration-color: var(--accent); } }
      .btn { transition: translate .3s var(--ease-out), box-shadow .3s, background-color .25s, color .25s, scale .18s var(--ease-out); }
      .btn:hover { translate: 0 -2px; }
      .btn:active { scale: .96; }
      .btn--ghost:hover { background: var(--ink); color: var(--paper); }
      .btn__arrow { transition: rotate .4s var(--ease-spring); }
      .btn:hover .btn__arrow { rotate: -45deg; }
      .logo { display: inline-block; transition: rotate .5s var(--ease-spring); }
      .logo:hover { rotate: -6deg; }
      .links a { transition: color .25s; }
      .links a:hover { color: var(--accent-dark); }
